# StepTube channels: this file IS the algorithm.
# Only channels listed here ever show up.
#
# Each entry needs a topic plus ONE way to find the channel:
#   handle: veritasium            # the @name from the channel URL (most reliable)
#   channel_id: UCxxxxxxxxxxxxxxx  # the raw id (100% reliable)
#   name: "Борис Трушин"           # display name, resolved via YouTube search (check build_report.json)
# Resolved ids are cached in site/data/channel_ids.json; fix a wrong match by
# switching that entry to `handle:` or `channel_id:`.
#
# Optional per channel:
#   include: ["lecture"]   # keep ONLY titles containing one of these words
#   exclude: ["podcast"]   # drop titles containing any of these words

# Tabs, in order of importance.
topics:
  ai: "AI & ML"
  math: "Mathematics"
  code: "Programming"
  science: "Science"
  business: "Business"
  other: "Other"
  review: "Under review"   # undecided channels; not shown on the New page

