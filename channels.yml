# StepTube seed channels
# ----------------------
# This file IS the algorithm. Only channels listed here ever show up.
#
# Each entry needs a topic and EITHER a `handle` (the @name in the channel URL)
# OR a `channel_id` (the UC... id). Handles are resolved automatically during
# the nightly build and cached in site/data/channel_ids.json.
#
# Optional per-channel keys:
#   min_minutes: 10       # skip videos shorter than this (needs duration data; ignored if unknown)
#   include: ["lecture"]  # keep ONLY videos whose title contains one of these words
#   exclude: ["podcast"]  # drop videos whose title contains any of these words
#
# Topics shown as tabs on the site (order matters):
topics:
  ai: "AI & ML"
  code: "Programming & Systems"
  science: "Science & Math"
  business: "Startups, Business & History"

channels:
