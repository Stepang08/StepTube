# StepTube channels: this file IS the algorithm.
# Only channels listed here ever show up.
#
# Each entry needs a topic plus ONE way to find the channel:
#   handle: veritasium            # the @name from the channel URL (most reliable)
#   channel_id: UCxxxxxxxxxxxxxxx  # the raw id (100% reliable)
#   name: "Борис Трушин"           # display name, resolved via YouTube search (check build_report.json)
# Resolved ids are cached in site/data/channel_ids.json; fix a wrong match by
# switching that entry to `handle:` or `channel_id:`.
#
# Optional per channel:
#   include: ["lecture"]   # keep ONLY titles containing one of these words
#   exclude: ["podcast"]   # drop titles containing any of these words
#   lang: ru               # the channel's language, so YouTube doesn't machine-translate
#                          # its titles (auto-detected as ru for Cyrillic names)

# Tabs, in order of importance.
topics:
  ai: "AI & ML"
  claude: "Claude Code"   # filled by the claude_code searches below, not by channels
  math: "Mathematics"
  code: "Programming"
  science: "Science"
  business: "Business"
  other: "Other"
  review: "Under review"   # undecided channels; not shown on the New page

# Sub-tabs inside a topic. Give a channel `sub: <key>` to file it.
subtopics:
  math:
    olympiad: "Olympiad"
    university: "University"
    popular: "Popular math"

# Playlists tab: the channels' own YouTube playlists, course-like ones only.
# Kept when a playlist has >= min_videos playable videos, isn't all Shorts or
# mostly live streams, and either its title has one of these words or at least
# half of its videos have numbered titles ("Lecture 3", "Занятие 12", ...).
playlists:
  min_videos: 3
  per_run: 25          # channels checked per hourly run; each channel at most once a day
  max_per_channel: 60  # newest-updated playlists per channel
  max_items: 300
  keywords: [lecture, course, lesson, tutorial, series, part, season, chapter, module, seminar,
             class, from scratch, explained, bootcamp, лекци, курс, урок, занят, семинар, цикл,
             разбор, подготовк, олимпиад, դաս, դասընթաց]

# Claude Code tab: videos from ANY channel, found by YouTube search every hour.
# Kept only if the title mentions Claude Code, it's not a Short (>= min_minutes),
# not a live/premiere, and it's in English or Russian. Clickbait is hidden.
claude_code:
  topic: claude
  queries:
    - { q: "claude code", hl: en }
    - { q: "claude code", hl: ru }
    - { q: "claude code tips", hl: en }
    - { q: "claude code tutorial", hl: en }
  pages: 2            # per query, every hour (newest first)
  backfill_pages: 15  # first run only: deeper, by date and by relevance
  min_minutes: 2
  max_videos: 2000

