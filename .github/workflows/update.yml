name: Update StepTube

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["channels.yml", "classics.yml", "scripts/**", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: steptube
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch channel feeds
        run: python scripts/build.py
      - name: Show resolution report
        run: cat site/data/build_report.json
      - name: Commit library
        run: |
          git config user.name "steptube-bot"
          git config user.email "steptube-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update library $(date -u +%F)"
          git push
      # Deploy only once Pages is enabled (Settings -> Pages -> Source: GitHub Actions),
      # so the daily data refresh never shows up as a failed run.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: 'echo "::notice::Library updated. Enable GitHub Pages (Settings > Pages > Source = GitHub Actions) to publish the site."'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
