name: Update StepTube

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["channels.yml", "classics.yml", "scripts/**", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: steptube
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 numpy==2.1.3
      - name: Fetch channel feeds
        run: python scripts/build.py
      - name: Show resolution report
        run: cat site/data/build_report.json
      - name: Commit library
        run: |
          git config user.name "steptube-bot"
          git config user.email "steptube-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update library $(date -u +%F)"
          git push
      # ---- smart-search index (embeddings) --------------------------------
      # Never blocks the deploy: if it fails, the site falls back to keyword search.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/embeddings
            scripts/embed/node_modules/@huggingface/transformers/.cache
          key: emb-${{ github.run_id }}
          restore-keys: emb-
      - name: Embed videos (multilingual-e5-small, incremental)
        id: embed
        continue-on-error: true
        timeout-minutes: 40
        run: |
          npm ci --prefix scripts/embed --no-audit --no-fund
          node scripts/embed/embed.mjs site/data/videos.json .cache/embeddings
          python scripts/compress_embeddings.py .cache/embeddings/vecs.f32

      # Deploy only once Pages is enabled (Settings -> Pages -> Source: GitHub Actions),
      # so the daily data refresh never shows up as a failed run.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: 'echo "::notice::Library updated. Enable GitHub Pages (Settings > Pages > Source = GitHub Actions) to publish the site."'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
